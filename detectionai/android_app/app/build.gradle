plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localfacescanner.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.localfacescanner.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        output.outputFileName = "FaceScanner.apk"
    }
}
